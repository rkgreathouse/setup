[project]
name = "logsweep"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = ["mypy>=2.4", "pytest>=9.2", "ruff>=0.17", "types-pyyaml>=6.0"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "PTH", "RET",
    "ANN", "T20", "TID", "C90", "ERA", "PLW0603", "PLR1702",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-nested-blocks = 4

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"argparse".msg = "Only the entry module (__main__.py) parses arguments."

[tool.ruff.lint.per-file-ignores]
"**/__main__.py" = ["T201", "TID251"]

[tool.mypy]
strict = true
python_version = "3.14"

[tool.pytest.ini_options]
testpaths = ["logsweep/tests"]
